name: security pipeline

on:
  push:
  pull_request:
    branches: [main]

# least privilege by default; jobs opt into more where needed
permissions:
  contents: read

jobs:
  supply-chain:
    name: supply chain gate (supplyx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: install the scanner's own dependencies
        run: pip install -r supplyx/requirements.txt
      - name: score every dependency before anything installs it
        # archives are downloaded and unpacked, never installed: no package code runs
        run: python -m supplyx.scan requirements-dev.txt

  sast:
    name: sast (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - name: bandit scan
        run: bandit -r src supplyx -ll

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # everything below installs the dependencies, so it waits for the supply chain gate
  lint-and-test:
    name: lint + test
    needs: [supply-chain]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt -r supplyx/requirements.txt
      - name: ruff lint
        run: ruff check .
      - name: pytest
        run: pytest -q

  dependency-scan:
    name: dependency audit (pip-audit)
    needs: [supply-chain]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: audit dependencies
        run: pip-audit -r requirements.txt

  container-scan:
    name: container scan (trivy) + sbom (syft)
    needs: [supply-chain]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: build image
        run: docker build -t supplyx-flask-demo:ci .
      - name: trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: supplyx-flask-demo:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: generate sbom (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: supplyx-flask-demo:ci
          format: spdx-json
          output-file: sbom.spdx.json
      - name: upload sbom artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.spdx.json

  publish-and-sign:
    name: publish + sign image (ghcr)
    # only on push to main, after every gate has passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [supply-chain, sast, secret-scan, lint-and-test, dependency-scan, container-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push image to ghcr
      id-token: write       # keyless signing via sigstore oidc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set lowercase image name
        # ghcr requires an all-lowercase image path
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: log in to ghcr
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest

      - name: install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: sign image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: generate sbom of pushed image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: attest sbom (signed provenance)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${DIGEST}"
